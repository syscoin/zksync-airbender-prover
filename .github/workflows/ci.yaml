name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel new runs for PRs only
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Add default permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:

  ############################
  #     General checks       #
  ############################
  check:
    # SYSCOIN: The upstream Matter Labs runner label is private to their organization. This
    # no-default-features CPU lane must run on a runner available to the Syscoin fork.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup runner
        uses: ./.github/actions/runner-setup
        with:
          save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      # no-default-features is set because the code is a mix of GPU/non-GPU compliant code
      # the flag needs to be removed once we allow both version to be build and control it via env var
      # these changes will be removed once https://github.com/matter-labs/prover-subsystem-internal/issues/49 is done
      - name: Run Clippy
        run: cargo clippy --no-default-features -- -D warnings

      - name: Build server
        run: cargo build --release --no-default-features

      - name: Run tests
        run: cargo test --no-default-features


  ###############################
  #  Mandatory CI status check  #
  ###############################
  ci-success:
    name: Github Status Check
    runs-on: ubuntu-latest
    # SYSCOIN: This merge gate must run after failed, cancelled, or skipped required jobs.
    if: ${{ always() }}
    needs:
      [
        check,
      ]
    steps:
      - name: Status
        run: |
          # SYSCOIN: Every job listed in ci-success.needs is mandatory; accept only success.
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "A mandatory CI job failed, was cancelled, or was skipped; blocking the PR"
            exit 1
          fi
