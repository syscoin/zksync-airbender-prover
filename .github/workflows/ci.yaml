name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel new runs for PRs only
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Add default permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:

  ############################
  #     General checks       #
  ############################
  check:
    # SYSCOIN: The upstream Matter Labs runner label is private to their organization. This
    # no-default-features CPU lane must run on a runner available to the Syscoin fork.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup runner
        uses: ./.github/actions/runner-setup
        with:
          save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check SNARK CPU startup policy without CUDA
        run: |
          cargo fmt --manifest-path .github/tests/snark-cpu-startup/Cargo.toml -- --check
          cargo clippy --locked --manifest-path .github/tests/snark-cpu-startup/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path .github/tests/snark-cpu-startup/Cargo.toml

      - name: Check isolated prover build recipes
        run: python3 -B .github/scripts/test_prover_role_recipes.py

      - name: Check role-specific verified CRS downloads
        run: python3 -B .github/scripts/test_verified_crs_roles.py

      - name: Check isolated Airbender source overlay
        run: python3 -B .github/scripts/test_patched_airbender_build.py

      - name: Check effective circuit identities in bundled caches
        run: python3 -B .github/scripts/test_cache_provenance.py

      - name: Check isolated GPU32 backend source overlay
        run: python3 -B .github/scripts/test_patched_gpu_backends.py

      - name: Check image and GPU backend provenance
        run: python3 -B .github/scripts/test_image_sbom_identity.py

      # SYSCOIN: This public CPU lane explicitly disables the default GPU SNARK
      # feature. It tests source/overlay policy, not a CUDA build or service proof.
      - name: Run Clippy
        run: bash scripts/cargo-with-patched-airbender.sh ci-clippy -- cargo clippy --locked --no-default-features -- -D warnings

      - name: Build server
        run: bash scripts/cargo-with-patched-airbender.sh ci-build -- cargo build --locked --release --no-default-features

      - name: Run tests
        run: |
          AIRBENDER_BUILD_ATTESTATION="${RUNNER_TEMP}/ci-test-airbender-inputs.json" \
            bash scripts/cargo-with-patched-airbender.sh ci-test -- cargo test --locked --no-default-features

      # Dependency unit tests are not run by the application workspace test command.
      # Reuse its verified, pinned source snapshot and target directory. The
      # dependency's own workspace is required to resolve its dev-dependencies;
      # the production build wrapper's package-selection policy stays unchanged.
      - name: Run pinned wrapper RNG and commitment tests
        env:
          RUST_MIN_STACK: "33554432"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          record="${RUNNER_TEMP}/ci-test-airbender-inputs.json"
          workspace="$(jq -er '.workspace' "${record}")"
          wrapper="$(dirname -- "${workspace}")/zkos-wrapper"
          target="$(jq -er '.cargo_target_dir' "${record}")"
          verify_wrapper() {
            python3 -B - "${wrapper}" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("patched_airbender", "scripts/prepare-patched-airbender.py")
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          helper.verify_wrapper(Path(sys.argv[1]), helper.load_wrapper_pins())
          PY
          }
          verify_wrapper
          test_status=0
          CARGO_TARGET_DIR="${target}" cargo test --manifest-path "${wrapper}/Cargo.toml" \
            --locked -p zkos-wrapper --lib buffered_os_rng::tests || test_status=$?
          if [[ "${test_status}" -eq 0 ]]; then
            CARGO_TARGET_DIR="${target}" cargo test --manifest-path "${wrapper}/Cargo.toml" \
              --locked -p zkos-wrapper --lib wrapper::tests::precomputed_commitment || test_status=$?
          fi
          verify_wrapper
          exit "${test_status}"

      # SYSCOIN: Exercise only the bounded 128-row, single-worker, NoPow fixture.
      # The application test command does not run dependency unit tests.
      - name: Run pinned native Boojum FRI query-count regression
        timeout-minutes: 20
        env:
          RUST_MIN_STACK: "33554432"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_BUILD_JOBS: "1"
        run: |
          record="${RUNNER_TEMP}/ci-test-airbender-inputs.json"
          workspace="$(jq -er '.workspace' "${record}")"
          crypto="$(dirname -- "${workspace}")/zksync-crypto"
          target="$(jq -er '.cargo_target_dir' "${record}")"
          verify_crypto() {
            python3 -B - "${crypto}" "${record}" <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("patched_airbender", "scripts/prepare-patched-airbender.py")
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          record = json.loads(Path(sys.argv[2]).read_text())
          helper.require(record["cargo_exit_code"] == 0 and record["inputs_reverified"] is True
                         and record["label"] == "ci-test", "CI application inputs were not verified")
          helper.require(record["zksync_crypto"]["inputs"] == helper.crypto_pins_metadata(),
                         "CI common crypto attestation differs from current pins")
          helper.verify_crypto(Path(sys.argv[1]), helper.load_crypto_pins())
          PY
          }
          verify_crypto
          test_status=0
          CARGO_TARGET_DIR="${target}" cargo test --manifest-path "${crypto}/Cargo.toml" \
            --locked -p boojum --lib cs::implementations::cs::test::prove_simple \
            -- --exact --nocapture --test-threads=1 || test_status=$?
          verify_crypto
          exit "${test_status}"


  ###############################
  #  Mandatory CI status check  #
  ###############################
  ci-success:
    name: Github Status Check
    runs-on: ubuntu-latest
    # SYSCOIN: This merge gate must run after failed, cancelled, or skipped required jobs.
    if: ${{ always() }}
    needs:
      [
        check,
      ]
    steps:
      - name: Status
        run: |
          # SYSCOIN: Every job listed in ci-success.needs is mandatory; accept only success.
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "A mandatory CI job failed, was cancelled, or was skipped; blocking the PR"
            exit 1
          fi
