name: Release binaries

permissions:
  # SYSCOIN: Default every job to read-only source access; the two narrowly scoped
  # job-level grants below authorize provenance generation and publication separately.
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use for the release."
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to use for the release."
        type: string
        required: true

env:
  # SYSCOIN: Validate this untrusted dispatch/caller input before using it in any shell or path.
  RELEASE_TAG: ${{ inputs.tag }}
  # SYSCOIN: Release the optional combined worker and the independently scalable FRI/SNARK workers.
  ZKSYNC_OS_PROVER_BIN: 'zksync-os-prover-service'
  ZKSYNC_OS_FRI_PROVER_BIN: 'zksync_os_fri_prover'
  ZKSYNC_OS_SNARK_PROVER_BIN: 'zksync_os_snark_prover'
  RELEASE_PROFILE: 'release'
  CUDAARCHS: '80;89;90'

defaults:
  run:
    shell: 'bash -ex {0}'

jobs:
  # Build prover binary for all target platforms
  build-bins:
    runs-on: ${{ matrix.runner }}
    # SYSCOIN: Grant OIDC/attestation writes only to the job that builds the three
    # subjects; it returns the resulting provenance URL to the publication job.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation-url: ${{ steps.attestation.outputs.attestation-url }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # SYSCOIN: The combined service always runs the FRI phase, whose program
          # commitment and proving backend require the gpu feature. CPU wrapping is
          # provided by the separate zksync-os-snark-prover binary, never this service.
          # Ubuntu-22.04 based high performance runner, GPU prover
          - runner: matterlabs-ci-hetzner-rtx6000-gpu
            target: x86_64-unknown-linux-gnu
            gpu: true

    steps:
      - name: Validate release tag
        run: |
          # SYSCOIN: Exclude shell metacharacters, path separators, and ambiguous ref syntax.
          if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          # SYSCOIN: Do not leave even a read token available to build scripts or dependencies.
          persist-credentials: false

      - name: Verify release source identity
        run: |
          # SYSCOIN: OIDC provenance describes GITHUB_SHA. Refuse to build a caller-supplied tag
          # unless that exact peeled tag commit is also the workflow event/caller commit.
          checked_out=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "${checked_out}" != "${tag_commit}" || "${checked_out}" != "${GITHUB_SHA}" ]]; then
            echo "Release source mismatch: checkout=${checked_out} tag=${tag_commit} workflow=${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Setup runner
        uses: ./.github/actions/runner-setup
        with:
          # SYSCOIN: Production builds never consume shared compiler/workspace caches or install
          # unrelated mutable development binaries.
          enable_cache: 'false'
          enable_sccache: 'false'
          minimal_rust: 'true'

      - name: Check CUDA version
        if: matrix.gpu
        run: |
          nvcc --version

      - name: Checkout era-bellman-cuda
        if: matrix.gpu
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: matter-labs/era-bellman-cuda
          # SYSCOIN: Production prover artifacts must not compile a mutable CUDA branch.
          ref: d1fa8670ee84ec3477c6cc1c85a3554cfa5e0206
          path: bellman-cuda
          fetch-depth: '1'
          # SYSCOIN: External build-source checkout must not retain the workflow token.
          persist-credentials: false

      - name: Build bellman-cuda
        shell: 'bash -ex {0}'
        if: matrix.gpu
        run: |
          # SYSCOIN: Always compile the pinned CUDA source in this attested run. A restored build
          # directory is not bound to nvcc/CMake/compiler versions, CUDAARCHS, or build flags.
          cmake -Bbellman-cuda/build -Sbellman-cuda/ -DCMAKE_BUILD_TYPE=Release
          cmake --build bellman-cuda/build/

      - name: Build
        env:
          BELLMAN_CUDA_DIR: ${{ github.workspace }}/bellman-cuda
        run: |
          # SYSCOIN: Publish the canonical production topology from the same pinned source: GPU
          # FRI workers, a CPU-only dedicated SNARK worker, and the optional combined GPU service.
          cargo build --locked --profile "${RELEASE_PROFILE}" \
            --target "${{ matrix.target }}" --bin "${ZKSYNC_OS_PROVER_BIN}" --features gpu
          cargo build --locked --profile "${RELEASE_PROFILE}" \
            --target "${{ matrix.target }}" --bin "${ZKSYNC_OS_FRI_PROVER_BIN}" --features gpu
          cargo build --locked --profile "${RELEASE_PROFILE}" \
            --target "${{ matrix.target }}" --bin "${ZKSYNC_OS_SNARK_PROVER_BIN}" --no-default-features

      - name: Prepare tarballs
        run: |
          # SYSCOIN: Package all three audited deployment roles from this one checked-out tag.
          mv "./target/${{ matrix.target }}/${RELEASE_PROFILE}/${ZKSYNC_OS_PROVER_BIN}" "./${ZKSYNC_OS_PROVER_BIN}"
          mv "./target/${{ matrix.target }}/${RELEASE_PROFILE}/${ZKSYNC_OS_FRI_PROVER_BIN}" "./${ZKSYNC_OS_FRI_PROVER_BIN}"
          mv "./target/${{ matrix.target }}/${RELEASE_PROFILE}/${ZKSYNC_OS_SNARK_PROVER_BIN}" "./${ZKSYNC_OS_SNARK_PROVER_BIN}"
          tar -czf "${ZKSYNC_OS_PROVER_BIN}-${RELEASE_TAG}-${{ matrix.target }}-gpu.tar.gz" \
              "${ZKSYNC_OS_PROVER_BIN}"
          tar -czf "${ZKSYNC_OS_FRI_PROVER_BIN}-${RELEASE_TAG}-${{ matrix.target }}-gpu.tar.gz" \
              "${ZKSYNC_OS_FRI_PROVER_BIN}"
          tar -czf "${ZKSYNC_OS_SNARK_PROVER_BIN}-${RELEASE_TAG}-${{ matrix.target }}-cpu.tar.gz" \
              "${ZKSYNC_OS_SNARK_PROVER_BIN}"

      - name: Binaries attestation
        id: attestation
        # SYSCOIN: Generate provenance in the GPU build job that actually compiled the artifacts.
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            ${{ env.ZKSYNC_OS_PROVER_BIN }}-${{ env.RELEASE_TAG }}-${{ matrix.target }}-gpu.tar.gz
            ${{ env.ZKSYNC_OS_FRI_PROVER_BIN }}-${{ env.RELEASE_TAG }}-${{ matrix.target }}-gpu.tar.gz
            ${{ env.ZKSYNC_OS_SNARK_PROVER_BIN }}-${{ env.RELEASE_TAG }}-${{ matrix.target }}-cpu.tar.gz

      - name: Upload binaries
        # SYSCOIN: Keep the three role-specific archives together for one release attestation.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zksync-os-provers-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
          path: |
            ${{ env.ZKSYNC_OS_PROVER_BIN }}-${{ env.RELEASE_TAG }}-${{ matrix.target }}-gpu.tar.gz
            ${{ env.ZKSYNC_OS_FRI_PROVER_BIN }}-${{ env.RELEASE_TAG }}-${{ matrix.target }}-gpu.tar.gz
            ${{ env.ZKSYNC_OS_SNARK_PROVER_BIN }}-${{ env.RELEASE_TAG }}-${{ matrix.target }}-cpu.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Attach binaries to the GitHub release
  release-bins:
    needs: [build-bins]
    # SYSCOIN: Publish the dedicated FRI/CPU-SNARK topology plus the optional combined service.
    runs-on: ubuntu-latest
    # SYSCOIN: Publication can write release contents but receives no OIDC or
    # attestation authority; provenance was already created by the builder.
    permissions:
      contents: write
    steps:

      - name: Validate release tag
        run: |
          # SYSCOIN: Revalidate at the publication trust boundary; jobs do not share shell state.
          if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Download binaries
        # SYSCOIN: Collect the complete role-specific artifact set produced above.
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: zksync-os-provers-${{ env.RELEASE_TAG }}-*.tar.gz
          path: dist
          merge-multiple: true

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # SYSCOIN: Release assets are immutable; an existing filename aborts instead of overwriting.
        run: gh release upload "${RELEASE_TAG}" dist/*

      - name: Update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          ATTESTATION_URL: ${{ needs.build-bins.outputs.attestation-url }}
        run: |
          # SYSCOIN: Publish explicit links for the supported combined, FRI, and CPU-SNARK roles.
          RELEASE_BODY=$(gh release view "${RELEASE_TAG}" --json body -q '.body')
          BINARIES_SECTION=$(cat <<- ENDBODY
          <!-- syscoin-prover-binaries:start -->
          ## Binaries

          | System | Architecture | Binary | Attestation |
          |:---:|:---:|:---:|:---|
          | <img src="https://www.svgrepo.com/download/448236/linux.svg" width="50"/> | x86_64 (GPU) | [${ZKSYNC_OS_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz](https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${ZKSYNC_OS_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz) | [Attestation](${ATTESTATION_URL}) |
          | <img src="https://www.svgrepo.com/download/448236/linux.svg" width="50"/> | x86_64 (GPU FRI) | [${ZKSYNC_OS_FRI_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz](https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${ZKSYNC_OS_FRI_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz) | [Attestation](${ATTESTATION_URL}) |
          | <img src="https://www.svgrepo.com/download/448236/linux.svg" width="50"/> | x86_64 (CPU SNARK) | [${ZKSYNC_OS_SNARK_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-cpu.tar.gz](https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${ZKSYNC_OS_SNARK_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-cpu.tar.gz) | [Attestation](${ATTESTATION_URL}) |
          <!-- syscoin-prover-binaries:end -->
          ENDBODY
          )
          printf '%s' "${RELEASE_BODY}" > release_body.md
          printf '%s\n' "${BINARIES_SECTION}" > binaries_section.md
          # SYSCOIN: Replace one owned notes section or append it once; malformed/duplicate markers
          # fail closed instead of accumulating ambiguous artifact tables on a rerun.
          python3 <<'PY'
          from pathlib import Path

          start = "<!-- syscoin-prover-binaries:start -->"
          end = "<!-- syscoin-prover-binaries:end -->"
          body = Path("release_body.md").read_text()
          section = Path("binaries_section.md").read_text().rstrip()
          if body.count(start) != body.count(end) or body.count(start) > 1:
              raise SystemExit("release notes contain malformed or duplicate Syscoin binary markers")
          if start in body:
              prefix, remainder = body.split(start, 1)
              _, suffix = remainder.split(end, 1)
              updated = f"{prefix.rstrip()}\n\n{section}{suffix}"
          elif body.strip():
              updated = f"{body.rstrip()}\n\n{section}\n"
          else:
              updated = f"{section}\n"
          Path("updated_body.md").write_text(updated)
          PY
          gh release edit "${RELEASE_TAG}" --notes-file updated_body.md
