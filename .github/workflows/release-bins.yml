name: Release binaries

permissions:
  # SYSCOIN: Default every job to read-only source access; the two narrowly scoped
  # job-level grants below authorize provenance generation and publication separately.
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use for the release."
        type: string
        required: true
      source_sha:
        description: "Exact 40-character commit SHA peeled from the release tag."
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to use for the release."
        type: string
        required: true
      source_sha:
        description: "Expected release source commit supplied by the trusted caller."
        type: string
        required: true

env:
  # SYSCOIN: Validate this untrusted dispatch/caller input before using it in any shell or path.
  RELEASE_TAG: ${{ inputs.tag }}
  # SYSCOIN: A manual dispatch may originate on any branch. Bind the requested tag to an
  # explicit source commit instead of incorrectly treating the workflow's GITHUB_SHA as it.
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
  # SYSCOIN: Release the optional combined worker and the independently scalable FRI/SNARK workers.
  ZKSYNC_OS_PROVER_BIN: 'zksync-os-prover-service'
  ZKSYNC_OS_FRI_PROVER_BIN: 'zksync_os_fri_prover'
  ZKSYNC_OS_SNARK_PROVER_BIN: 'zksync_os_snark_prover'
  RELEASE_PROFILE: 'release'
  CUDAARCHS: '80;89;90'
  # SYSCOIN: GPU SNARK/combined include the actual tested RTX5090 architecture;
  # the package-scoped FRI build retains its existing architecture selection.
  GPU_CUDAARCHS: '80;89;90;120'
  CARGO_HOME: /tmp/prover-cargo
  RUSTUP_HOME: /tmp/prover-rustup

defaults:
  run:
    shell: 'bash -ex {0}'

jobs:
  # Separate jobs bound peak target-directory use and generate role-specific provenance.
  build-bins:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu24.04@sha256:020bc241a628776338f4d4053fed4c38f6f7f3d7eb5919fecb8de313bb8ba47c
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        role: [combined, fri, snark, snark-cpu]
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
          rm -rf /var/lib/apt/lists/*
      - name: Validate release tag
        run: |
          # SYSCOIN: Exclude shell metacharacters, path separators, and ambiguous ref syntax.
          if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          # SYSCOIN: Require the caller to capture the complete commit identity; abbreviated or
          # symbolic revisions would be ambiguous if repository history changes later.
          if [[ ! "${RELEASE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release source SHA: ${RELEASE_SOURCE_SHA}" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          # SYSCOIN: Do not leave even a read token available to build scripts or dependencies.
          persist-credentials: false

      - name: Verify release source identity
        run: |
          # SYSCOIN: GITHUB_SHA identifies the workflow invocation, which can legitimately be the
          # default branch during a manual rebuild of an older release. The explicitly captured
          # release source instead binds both the checked-out tree and the tag's peeled commit.
          checked_out=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "${checked_out}" != "${tag_commit}" || "${checked_out}" != "${RELEASE_SOURCE_SHA}" ]]; then
            echo "Release source mismatch: checkout=${checked_out} tag=${tag_commit} expected=${RELEASE_SOURCE_SHA} workflow=${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Checkout hardened release tooling
        # SYSCOIN: Keep the setup action bound to the exact commit that supplied this
        # workflow. Rebuilding an older source tag must not execute that tag's obsolete
        # local action, while the source checkout remains the workspace root so its
        # rust-toolchain.toml still selects the compiler used for the rebuild.
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tooling
          sparse-checkout: |
            .github/actions/build-release-role
            docker/prover-build-pins.json
            .github/scripts
            scripts
            patches
          fetch-depth: '1'
          persist-credentials: false

      - name: Build and package role
        id: build
        uses: ./.release-tooling/.github/actions/build-release-role
        with:
          role: ${{ matrix.role }}
          target: x86_64-unknown-linux-gnu
          release_tag: ${{ inputs.tag }}
          tooling_sha: ${{ job.workflow_sha }}

      - name: Generate GitHub build provenance predicate
        id: build-provenance
        # SYSCOIN: Retain GitHub's standard SLSA predicate, then bind the separately checked-out
        # release source below; an old-tag rebuild intentionally has a different workflow SHA.
        uses: actions/attest-build-provenance/predicate@864457a58d4733d7f1574bd8821fa24e02cf7538 # predicate@2.0.0

      - name: Bind release source into provenance
        env:
          BASE_PROVENANCE: ${{ steps.build-provenance.outputs.predicate }}
          BASE_PROVENANCE_TYPE: ${{ steps.build-provenance.outputs.predicate-type }}
          ATTEST_RELEASE_TAG: ${{ inputs.tag }}
          ATTEST_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          TOOLING_REPOSITORY: ${{ job.workflow_repository }}
          TOOLING_SHA: ${{ job.workflow_sha }}
          AIRBENDER_PINS: ${{ steps.build.outputs.airbender_pins }}
          AIRBENDER_RECORDS: ${{ steps.build.outputs.airbender_records }}
          GPU_BACKEND_PINS: ${{ steps.build.outputs.gpu_backend_pins }}
          RELEASE_ROLE: ${{ matrix.role }}
        run: |
          # SYSCOIN: The stock predicate binds the builder invocation. Add the validated tag source
          # as a distinct resolved dependency so a manual old-tag rebuild remains honest.
          if [[ "${BASE_PROVENANCE_TYPE}" != "https://slsa.dev/provenance/v1" ]]; then
            echo "Unexpected build provenance predicate type: ${BASE_PROVENANCE_TYPE}" >&2
            exit 1
          fi
          jq -e \
            --arg source_uri "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@refs/tags/${ATTEST_RELEASE_TAG}" \
            --arg source_sha "${ATTEST_RELEASE_SOURCE_SHA}" \
            --arg tooling_uri "git+${GITHUB_SERVER_URL}/${TOOLING_REPOSITORY}@${TOOLING_SHA}" \
            --arg tooling_sha "${TOOLING_SHA}" \
            --argjson airbender "${AIRBENDER_PINS}" \
            --argjson airbender_records "${AIRBENDER_RECORDS}" \
            --argjson gpu_backend "${GPU_BACKEND_PINS}" \
            --arg role "${RELEASE_ROLE}" \
            '
              if .buildDefinition.buildType != "https://actions.github.io/buildtypes/workflow/v1"
                  or (.buildDefinition.externalParameters.workflow | type) != "object"
                  or (.buildDefinition.resolvedDependencies | type) != "array"
                  or (.runDetails.builder.id | type) != "string"
              then
                error("unexpected GitHub provenance predicate shape")
              else
                .
              end
              | if $gpu_backend.zksync_crypto != $airbender.zksync_crypto then
                  error("GPU and common proving provenance disagree on common crypto") else . end
              | .buildDefinition.resolvedDependencies |=
                  if any(.[]; .uri == $source_uri and .digest.gitCommit != $source_sha) then
                    error("release source conflicts with the generated build provenance")
                  elif any(.[]; .uri == $source_uri and .digest.gitCommit == $source_sha) then
                    .
                  else
                    . + [{uri: $source_uri, digest: {gitCommit: $source_sha}}]
                  end
              | .buildDefinition.resolvedDependencies += [
                  {uri: $tooling_uri, digest: {gitCommit: $tooling_sha}},
                  {uri: ("git+" + $airbender.pins.upstream_url), digest: {gitCommit: $airbender.pins.upstream_commit}},
                  {uri: ("git+" + $airbender.pins.fork_url), digest: {gitCommit: $airbender.pins.fork_commit}},
                  {uri: ($tooling_uri + "/patches/airbender-fork-source.json"), digest: {sha256: $airbender.manifest_sha256}},
                  {uri: ($tooling_uri + "/patches/" + $airbender.pins.overlay_lock_file), digest: {sha256: $airbender.pins.overlay_lock_sha256}},
                  {uri: ("git+" + $airbender.zkos_wrapper.pins.upstream_url), digest: {gitCommit: $airbender.zkos_wrapper.pins.upstream_commit}},
                  {uri: ("git+" + $airbender.zkos_wrapper.pins.fork_url), digest: {gitCommit: $airbender.zkos_wrapper.pins.fork_commit}},
                  {uri: ($tooling_uri + "/patches/zkos-wrapper-fork-source.json"), digest: {sha256: $airbender.zkos_wrapper.manifest_sha256}},
                  {uri: ("git+" + $airbender.zksync_crypto.pins.upstream_url), digest: {gitCommit: $airbender.zksync_crypto.pins.upstream_commit}},
                  {uri: ($tooling_uri + "/patches/zksync-crypto-fork-source.json"), digest: {sha256: $airbender.zksync_crypto.manifest_sha256}},
                  {uri: ("git+" + $airbender.zksync_crypto.pins.fork_url), digest: {gitCommit: $airbender.zksync_crypto.pins.fork_commit}},
                  {uri: ($source_uri + "/Cargo.lock"), digest: {sha256: $airbender.selected_lock.canonical_lock_sha256}},
                  {uri: "syscoin:generated-lock:common-proving-source-identity-only-v4", digest: {sha256: $airbender.selected_lock.overlay_lock_sha256}},
                  {uri: ($tooling_uri + "/patches/gpu32-memory.json"), digest: {sha256: $gpu_backend.manifest_sha256}},
                  {uri: ($tooling_uri + "/patches/" + $gpu_backend.pins.crypto.patch_file), digest: {sha256: $gpu_backend.pins.crypto.patch_sha256}},
                  {uri: ($tooling_uri + "/patches/" + $gpu_backend.pins.bellman.patch_file), digest: {sha256: $gpu_backend.pins.bellman.patch_sha256}},
                  {uri: ("git+" + $gpu_backend.pins.crypto.upstream_url), digest: {gitCommit: $gpu_backend.pins.crypto.upstream_commit}},
                  {uri: ("git+" + $gpu_backend.pins.bellman.upstream_url), digest: {gitCommit: $gpu_backend.pins.bellman.upstream_commit}},
                  {uri: "syscoin:generated-lock:common-proving-and-crypto-gpu-source-identity-only-v3", digest: {sha256: $gpu_backend.selected_lock.combined_overlay_lock_sha256}}
                ]
              | .buildDefinition.internalParameters.syscoinAirbenderBuild = {
                  inputs: $airbender, roleInputRecords: $airbender_records, cargoLocked: true
                }
              | .buildDefinition.internalParameters.syscoinGpuBackendBuild = {
                  inputs: $gpu_backend, roles: (if ($role == "combined" or $role == "snark") then [$role] else [] end)
                }
            ' <<< "${BASE_PROVENANCE}" > "${RUNNER_TEMP}/release-provenance.json"

      - name: Attest role archive
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-path: ${{ steps.build.outputs.archive }}
          predicate-type: 'https://slsa.dev/provenance/v1'
          predicate-path: ${{ runner.temp }}/release-provenance.json

      - name: Record attestation URL
        env:
          ATTESTATION_URL: ${{ steps.attestation.outputs.attestation-url }}
        run: |
          [[ "${ATTESTATION_URL}" == "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/attestations/"* ]]
          printf '%s\n' "${ATTESTATION_URL}" > attestation-url.txt

      - name: Upload role archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.role }}-${{ env.RELEASE_TAG }}
          path: |
            ${{ steps.build.outputs.archive }}
            attestation-url.txt
          if-no-files-found: error
          retention-days: 1

  # Attach binaries to the GitHub release
  release-bins:
    needs: [build-bins]
    # SYSCOIN: Publish default GPU SNARK and explicit CPU fallback as distinct assets.
    runs-on: ubuntu-latest
    # SYSCOIN: Publication can write release contents but receives no OIDC or
    # attestation authority; provenance was already created by the builder.
    permissions:
      contents: write
      attestations: read
    steps:

      - name: Validate release tag
        run: |
          # SYSCOIN: Revalidate at the publication trust boundary; jobs do not share shell state.
          if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release source SHA: ${RELEASE_SOURCE_SHA}" >&2
            exit 1
          fi

      - name: Download binaries
        # SYSCOIN: Collect the complete role-specific artifact set produced above.
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-*-${{ env.RELEASE_TAG }}
          path: role-artifacts

      - name: Verify and collect the four signed roles
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLING_SHA: ${{ job.workflow_sha }}
        run: |
          mkdir dist
          for role in combined fri snark snark-cpu; do
            case "${role}" in
              combined) binary="${ZKSYNC_OS_PROVER_BIN}"; kind=gpu ;;
              fri) binary="${ZKSYNC_OS_FRI_PROVER_BIN}"; kind=gpu ;;
              snark) binary="${ZKSYNC_OS_SNARK_PROVER_BIN}"; kind=gpu ;;
              snark-cpu) binary="${ZKSYNC_OS_SNARK_PROVER_BIN}"; kind=cpu ;;
            esac
            directory="role-artifacts/release-${role}-${RELEASE_TAG}"
            archive="${binary}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-${kind}.tar.gz"
            test -f "${directory}/${archive}"
            test "$(find "${directory}" -maxdepth 1 -type f | wc -l)" -eq 2
            attestation_url="$(cat "${directory}/attestation-url.txt")"
            [[ "${attestation_url}" == "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/attestations/"* ]]
            gh attestation verify "${directory}/${archive}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-bins.yml" \
              --signer-digest "${TOOLING_SHA}" --deny-self-hosted-runners
            cp "${directory}/${archive}" dist/
            printf '%s\n' "${attestation_url}" > "dist/${role}-attestation-url.txt"
          done

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # SYSCOIN: Release assets are immutable; an existing filename aborts instead of overwriting.
        run: gh release upload "${RELEASE_TAG}" dist/*.tar.gz

      - name: Update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
        run: |
          COMBINED_ATTESTATION="$(cat dist/combined-attestation-url.txt)"
          FRI_ATTESTATION="$(cat dist/fri-attestation-url.txt)"
          SNARK_ATTESTATION="$(cat dist/snark-attestation-url.txt)"
          SNARK_CPU_ATTESTATION="$(cat dist/snark-cpu-attestation-url.txt)"
          RELEASE_BODY=$(gh release view "${RELEASE_TAG}" --json body -q '.body')
          BINARIES_SECTION=$(cat <<- ENDBODY
          <!-- syscoin-prover-binaries:start -->
          ## Binaries

          | System | Architecture | Binary | Attestation |
          |:---:|:---:|:---:|:---|
          | <img src="https://www.svgrepo.com/download/448236/linux.svg" width="50"/> | x86_64 (GPU) | [${ZKSYNC_OS_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz](https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${ZKSYNC_OS_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz) | [Attestation](${COMBINED_ATTESTATION}) |
          | <img src="https://www.svgrepo.com/download/448236/linux.svg" width="50"/> | x86_64 (GPU FRI) | [${ZKSYNC_OS_FRI_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz](https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${ZKSYNC_OS_FRI_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz) | [Attestation](${FRI_ATTESTATION}) |
          | <img src="https://www.svgrepo.com/download/448236/linux.svg" width="50"/> | x86_64 (GPU SNARK, default) | [${ZKSYNC_OS_SNARK_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz](https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${ZKSYNC_OS_SNARK_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-gpu.tar.gz) | [Attestation](${SNARK_ATTESTATION}) |
          | <img src="https://www.svgrepo.com/download/448236/linux.svg" width="50"/> | x86_64 (CPU SNARK) | [${ZKSYNC_OS_SNARK_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-cpu.tar.gz](https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${ZKSYNC_OS_SNARK_PROVER_BIN}-${RELEASE_TAG}-x86_64-unknown-linux-gnu-cpu.tar.gz) | [Attestation](${SNARK_CPU_ATTESTATION}) |
          <!-- syscoin-prover-binaries:end -->
          ENDBODY
          )
          printf '%s' "${RELEASE_BODY}" > release_body.md
          printf '%s\n' "${BINARIES_SECTION}" > binaries_section.md
          # SYSCOIN: Replace one owned notes section or append it once; malformed/duplicate markers
          # fail closed instead of accumulating ambiguous artifact tables on a rerun.
          python3 <<'PY'
          from pathlib import Path

          start = "<!-- syscoin-prover-binaries:start -->"
          end = "<!-- syscoin-prover-binaries:end -->"
          body = Path("release_body.md").read_text()
          section = Path("binaries_section.md").read_text().rstrip()
          if body.count(start) != body.count(end) or body.count(start) > 1:
              raise SystemExit("release notes contain malformed or duplicate Syscoin binary markers")
          if start in body:
              prefix, remainder = body.split(start, 1)
              _, suffix = remainder.split(end, 1)
              updated = f"{prefix.rstrip()}\n\n{section}{suffix}"
          elif body.strip():
              updated = f"{body.rstrip()}\n\n{section}\n"
          else:
              updated = f"{section}\n"
          Path("updated_body.md").write_text(updated)
          PY
          gh release edit "${RELEASE_TAG}" --notes-file updated_body.md
