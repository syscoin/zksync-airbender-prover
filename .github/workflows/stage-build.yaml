name: Docker build and release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Compatible existing Git tag whose exact application source should be built."
        type: string
        required: true
      source_sha:
        description: "Exact 40-character commit SHA peeled from tag_name."
        type: string
        required: true
  push:
    branches:
      - main
    tags:
      - v**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: 'bash -ex {0}'

# SYSCOIN: Jobs opt into only the additional publication or attestation permissions they need.
permissions:
  contents: read

jobs:
  setup:
    name: Resolve and bind image source
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image-tag.outputs.version }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Validate requested source identity
        id: requested-source
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${REQUESTED_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "Invalid image source tag: ${REQUESTED_TAG}" >&2
              exit 1
            fi
            if [[ "${REQUESTED_TAG}" == "latest" ]]; then
              echo "The mutable latest label is reserved for main-branch pushes" >&2
              exit 1
            fi
            if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid image source SHA: ${REQUESTED_SOURCE_SHA}" >&2
              exit 1
            fi
            checkout_ref="refs/tags/${REQUESTED_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # SYSCOIN: Fetch the pushed tag ref itself. A depth-one SHA checkout does not create
            # refs/tags/<name>, so the identity check below could not peel the local tag.
            checkout_ref="${GITHUB_REF}"
          else
            checkout_ref="${GITHUB_SHA}"
          fi
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact requested source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.requested-source.outputs.checkout_ref }}
          fetch-depth: '1'
          persist-credentials: false

      - name: Verify source identity
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag_commit="$(git rev-parse "refs/tags/${REQUESTED_TAG}^{commit}")"
            if [[ "${checked_out}" != "${tag_commit}" || "${checked_out}" != "${REQUESTED_SOURCE_SHA}" ]]; then
              echo "Image source mismatch: checkout=${checked_out} tag=${tag_commit} expected=${REQUESTED_SOURCE_SHA}" >&2
              exit 1
            fi
            source_ref="refs/tags/${REQUESTED_TAG}"
          else
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              tag_object="$(git rev-parse "${GITHUB_REF}")"
              tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
              if [[ "${checked_out}" != "${tag_commit}" ]] \
                  || [[ "${GITHUB_SHA}" != "${tag_object}" && "${GITHUB_SHA}" != "${tag_commit}" ]]; then
                echo "Image source mismatch: checkout=${checked_out} tag=${tag_commit} tag_object=${tag_object} event=${GITHUB_SHA}" >&2
                exit 1
              fi
            elif [[ "${checked_out}" != "${GITHUB_SHA}" ]]; then
              echo "Image source mismatch: checkout=${checked_out} event=${GITHUB_SHA}" >&2
              exit 1
            fi
            source_ref="${GITHUB_REF}"
          fi

          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${checked_out}" >> "${GITHUB_OUTPUT}"

      - name: Compute SHA tag
        id: sha-tag
        run: echo "tag=${GITHUB_SHA::7}-$(date +%s%3N)" >> "${GITHUB_OUTPUT}"

      - name: Normalize shared image tag
        id: image-tag
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/zksync-airbender-prover
          tags: |
            type=raw,value=${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || steps.sha-tag.outputs.tag }}

  build-images:
    name: Build, push, and attest Docker images
    needs: [setup]
    runs-on: matterlabs-ci-runner-high-performance
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - zksync-airbender-prover
          - zksync-os-prover-fri
          - zksync-os-prover-snark
    steps:
      - name: Checkout bound application source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          path: .image-source
          fetch-depth: '1'
          persist-credentials: false

      - name: Checkout hardened image tooling
        # SYSCOIN: A manual old-tag rebuild uses the exact commit that supplied this workflow for
        # Dockerfiles and verified download pins, independently of the application source above.
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .image-tooling
          # Cone mode includes repository-root files (including .dockerignore) with this directory.
          # SYSCOIN: Load the digest handoff helper from the same verified tooling revision.
          sparse-checkout: |
            docker
            .github/scripts
          fetch-depth: '1'
          persist-credentials: false

      - name: Prepare bound source and app artifacts
        id: source
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          TOOLING_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C .image-source rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C .image-tooling rev-parse HEAD)" == "${TOOLING_SHA}" ]]
          [[ -z "$(git -C .image-source status --porcelain --untracked-files=all)" ]]
          [[ -z "$(git -C .image-tooling status --porcelain --untracked-files=all)" ]]
          # SYSCOIN: Check the digest helper's runtime before starting an expensive image build.
          python3 --version
          build_context="${RUNNER_TEMP}/prover-image-context"
          .image-tooling/docker/prepare-prover-image-context.sh \
            .image-source .image-tooling "${build_context}"
          build_pins="$(jq -ce '
            if .schema != "syscoin-prover-image-build-pins-v1"
                or (.rust_toolchain | type) != "string"
                or (.rustup_init.version | type) != "string"
                or ((.rustup_init.sha256 | type) != "string" or (.rustup_init.sha256 | test("^[0-9a-f]{64}$") | not))
                or (.cmake.version | type) != "string"
                or ((.cmake.sha256 | type) != "string" or (.cmake.sha256 | test("^[0-9a-f]{64}$") | not))
                or (.cuda_architectures | type) != "string"
                or ((.bellman_cuda.repository | type) != "string" or (.bellman_cuda.repository | startswith("https://") | not))
                or ((.bellman_cuda.commit | type) != "string" or (.bellman_cuda.commit | test("^[0-9a-f]{40}$") | not))
                or ((.crs.url | type) != "string" or (.crs.url | startswith("https://") | not))
                or ((.crs.size | type) != "number" or .crs.size <= 0)
                or ((.crs.sha256 | type) != "string" or (.crs.sha256 | test("^[0-9a-f]{64}$") | not))
            then error("invalid prover image build pins") else . end
          ' "${build_context}/docker/prover-build-pins.json")"
          rust_toolchain="$(jq -r '.rust_toolchain' <<< "${build_pins}")"
          [[ "$(sed -nE 's/^channel = \"([^\"]+)\"$/\1/p' "${build_context}/rust-toolchain.toml")" == "${rust_toolchain}" ]]
          app_bin_sha256="$(sha256sum "${build_context}/multiblock_batch.bin" | awk '{print $1}')"
          app_bin_size="$(wc -c < "${build_context}/multiblock_batch.bin" | awk '{print $1}')"
          app_text_sha256="$(sha256sum "${build_context}/multiblock_batch.text" | awk '{print $1}')"
          app_text_size="$(wc -c < "${build_context}/multiblock_batch.text" | awk '{print $1}')"
          [[ "$(sha256sum .image-source/multiblock_batch.bin | awk '{print $1}')" == "${app_bin_sha256}" ]]
          [[ "$(sha256sum .image-source/multiblock_batch.text | awk '{print $1}')" == "${app_text_sha256}" ]]
          echo "build_context=${build_context}" >> "${GITHUB_OUTPUT}"
          echo "build_pins=${build_pins}" >> "${GITHUB_OUTPUT}"
          echo "app_bin_sha256=${app_bin_sha256}" >> "${GITHUB_OUTPUT}"
          echo "app_bin_size=${app_bin_size}" >> "${GITHUB_OUTPUT}"
          echo "app_text_sha256=${app_text_sha256}" >> "${GITHUB_OUTPUT}"
          echo "app_text_size=${app_text_size}" >> "${GITHUB_OUTPUT}"

      - name: Login to Docker Hub for pinned base images
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure Google Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev -q

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
            us-docker.pkg.dev/matterlabs-infra/matterlabs-docker/${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.setup.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.syscoin.prover.source-ref=${{ needs.setup.outputs.source_ref }}
            io.syscoin.prover.tooling-revision=${{ github.workflow_sha }}
            io.syscoin.prover.app-bin-sha256=${{ steps.source.outputs.app_bin_sha256 }}
            io.syscoin.prover.app-text-sha256=${{ steps.source.outputs.app_text_sha256 }}
            io.syscoin.prover.security-level=100
            io.syscoin.prover.protocol=v32-proving-v8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and push exact image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ steps.source.outputs.build_context }}
          file: ${{ steps.source.outputs.build_context }}/docker/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SYSCOIN: Do not admit shared writable compiler or BuildKit caches into an attested build.
          no-cache: true
          # SYSCOIN: Retain BuildKit's own material list (including digest-pinned base images)
          # alongside the GitHub source/app/CRS attestation below.
          provenance: mode=max

      - name: Generate GitHub build provenance predicate
        id: build-provenance
        uses: actions/attest-build-provenance/predicate@864457a58d4733d7f1574bd8821fa24e02cf7538 # predicate@2.0.0

      - name: Bind source, app, toolchain, and CRS into provenance
        env:
          BASE_PROVENANCE: ${{ steps.build-provenance.outputs.predicate }}
          BASE_PROVENANCE_TYPE: ${{ steps.build-provenance.outputs.predicate-type }}
          SOURCE_REF: ${{ needs.setup.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          TOOLING_REPOSITORY: ${{ github.repository }}
          TOOLING_SHA: ${{ github.workflow_sha }}
          APP_BIN_SHA256: ${{ steps.source.outputs.app_bin_sha256 }}
          APP_BIN_SIZE: ${{ steps.source.outputs.app_bin_size }}
          APP_TEXT_SHA256: ${{ steps.source.outputs.app_text_sha256 }}
          APP_TEXT_SIZE: ${{ steps.source.outputs.app_text_size }}
          BUILD_PINS: ${{ steps.source.outputs.build_pins }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          if [[ "${BASE_PROVENANCE_TYPE}" != "https://slsa.dev/provenance/v1" ]]; then
            echo "Unexpected build provenance predicate type: ${BASE_PROVENANCE_TYPE}" >&2
            exit 1
          fi
          jq -e \
            --arg source_uri "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${SOURCE_REF}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg tooling_uri "git+${GITHUB_SERVER_URL}/${TOOLING_REPOSITORY}@${TOOLING_SHA}" \
            --arg tooling_repository "${TOOLING_REPOSITORY}" \
            --arg tooling_sha "${TOOLING_SHA}" \
            --arg app_bin_sha256 "${APP_BIN_SHA256}" \
            --argjson app_bin_size "${APP_BIN_SIZE}" \
            --arg app_text_sha256 "${APP_TEXT_SHA256}" \
            --argjson app_text_size "${APP_TEXT_SIZE}" \
            --arg component "${COMPONENT}" \
            --argjson build_pins "${BUILD_PINS}" \
            '
              if .buildDefinition.buildType != "https://actions.github.io/buildtypes/workflow/v1"
                  or (.buildDefinition.internalParameters | type) != "object"
                  or (.buildDefinition.resolvedDependencies | type) != "array"
                  or (.runDetails.builder.id | type) != "string"
              then error("unexpected GitHub provenance predicate shape") else . end
              | .buildDefinition.resolvedDependencies += [
                  {uri: $source_uri, digest: {gitCommit: $source_sha}},
                  {uri: $tooling_uri, digest: {gitCommit: $tooling_sha}}
                ]
              | if $component == "zksync-airbender-prover" then
                  .buildDefinition.resolvedDependencies += [
                    {uri: ("git+" + $build_pins.bellman_cuda.repository), digest: {gitCommit: $build_pins.bellman_cuda.commit}}
                  ]
                else . end
              | if $component != "zksync-os-prover-fri" then
                  .buildDefinition.resolvedDependencies += [
                    {uri: $build_pins.crs.url, digest: {sha256: $build_pins.crs.sha256}}
                  ]
                else . end
              | .buildDefinition.internalParameters.syscoinProverImage = {
                  component: $component,
                  source: {ref: $source_uri, gitCommit: $source_sha},
                  tooling: {repository: $tooling_repository, gitCommit: $tooling_sha},
                  cargoLocked: true,
                  rustToolchain: $build_pins.rust_toolchain,
                  rustupInit: $build_pins.rustup_init,
                  cmake: $build_pins.cmake,
                  cudaArchitectures: (if $component == "zksync-os-prover-snark" then null else $build_pins.cuda_architectures end),
                  bellmanCudaCommit: (if $component == "zksync-airbender-prover" then $build_pins.bellman_cuda.commit else null end),
                  securityLevel: 100,
                  protocolLane: "v32-proving-v8",
                  app: {
                    bin: {sha256: $app_bin_sha256, size: $app_bin_size},
                    text: {sha256: $app_text_sha256, size: $app_text_size}
                  },
                  trustedSetup: (if $component != "zksync-os-prover-fri" then
                    {sha256: $build_pins.crs.sha256, size: $build_pins.crs.size}
                  else null end)
                }
            ' <<< "${BASE_PROVENANCE}" > "${RUNNER_TEMP}/${COMPONENT}-provenance.json"

      - name: Attest GHCR image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/${{ matrix.component }}-provenance.json
          push-to-registry: true

      - name: Attest Google Artifact Registry image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: us-docker.pkg.dev/matterlabs-infra/matterlabs-docker/${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/${{ matrix.component }}-provenance.json
          push-to-registry: true

      # SYSCOIN: A separate immutable artifact preserves every matrix result; shared job
      # outputs can retain only the last finishing component's digest.
      - name: Record exact built image identity
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          TOOLING_SHA: ${{ github.workflow_sha }}
          VERSION: ${{ needs.setup.outputs.image_tag }}
          COMPONENT: ${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 .image-tooling/.github/scripts/image-sbom-identity.py record \
            "${COMPONENT}" "${IMAGE_DIGEST}" > "${RUNNER_TEMP}/image-digest.json"

      - name: Preserve component digest for SBOM generation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prover-image-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}
          path: ${{ runner.temp }}/image-digest.json
          if-no-files-found: error

      - name: Publish deployable digest summary
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo
            echo '```text'
            echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}"
            echo "us-docker.pkg.dev/matterlabs-infra/matterlabs-docker/${{ matrix.component }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # SYSCOIN: A single collector validates all matrix artifacts before exposing reusable inputs.
  collect-image-digests:
    name: Validate complete image digest inventory
    needs: [setup, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_digests: ${{ steps.collect.outputs.image_digests }}
      build_run_attempt: ${{ steps.collect.outputs.build_run_attempt }}
    steps:
      - name: Checkout bound digest validation tooling
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .image-tooling
          sparse-checkout: .github/scripts
          fetch-depth: '1'
          persist-credentials: false

      - name: Download this build attempt's component identities
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: prover-image-digest-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .image-digests
          # SYSCOIN: Keep artifact directories separate so duplicate records cannot overwrite.
          merge-multiple: false

      - name: Validate every component and publish immutable digests
        id: collect
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          TOOLING_SHA: ${{ github.workflow_sha }}
          VERSION: ${{ needs.setup.outputs.image_tag }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C .image-tooling rev-parse HEAD)" == "${TOOLING_SHA}" ]]
          [[ -z "$(git -C .image-tooling status --porcelain --untracked-files=all)" ]]
          image_digests="$(python3 .image-tooling/.github/scripts/image-sbom-identity.py collect .image-digests)"
          echo "image_digests=${image_digests}" >> "${GITHUB_OUTPUT}"
          echo "build_run_attempt=${BUILD_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

  sbom-generation:
    name: SBOM
    needs: [setup, collect-image-digests]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/sbom-analysis-reusable.yaml
    secrets: inherit
    with:
      version: ${{ needs.setup.outputs.image_tag }}
      source_sha: ${{ needs.setup.outputs.source_sha }}
      image_digests: ${{ needs.collect-image-digests.outputs.image_digests }}
      build_run_attempt: ${{ needs.collect-image-digests.outputs.build_run_attempt }}
