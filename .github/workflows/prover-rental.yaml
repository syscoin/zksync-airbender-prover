name: Prover rental controller

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      ZKSYNC_OS_SERVER_DIR: ${{ github.workspace }}/companion-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out the paired server service implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: syscoin/zksync-os-server
          ref: 3ab2e3c60917feb2443f58c97c866ed2b2bcab0a
          path: companion-server
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Foundry for service signatures
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: v1.7.1
      - name: Install trusted-host SDK in an isolated environment
        run: |
          test -f "$ZKSYNC_OS_SERVER_DIR/scripts/prover-service/keeper.py"
          python3 -m venv "$RUNNER_TEMP/prover-rental"
          "$RUNNER_TEMP/prover-rental/bin/python" -m pip install -r scripts/prover-rental/requirements-controller.txt
      - name: Verify the locked Serverless SDK in the image's Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/serverless-sdk"
          "$RUNNER_TEMP/serverless-sdk/bin/python" -m pip install --only-binary=:all: --require-hashes -r scripts/prover-rental/requirements-serverless.txt
          "$RUNNER_TEMP/serverless-sdk/bin/python" -m pip check
          "$RUNNER_TEMP/serverless-sdk/bin/python" -c 'import runpod; import backports.zstd; from importlib.metadata import version; assert version("runpod") == "1.12.0"'
      - name: Test lifecycle, queue scheduling, and offline SDK contracts
        run: |
          "$RUNNER_TEMP/prover-rental/bin/python" - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("scripts/prover-rental", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
