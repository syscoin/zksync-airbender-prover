name: Release-please

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout release inputs
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # Refuse to create a tag from an incomplete version bump. Release PRs
      # must update both lockfiles and the reviewed dependency-exception scope.
      - name: Verify release inputs
        run: python3 .github/scripts/check_release_inputs.py
      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # A direct reusable-workflow call avoids relying on tag-push events suppressed
  # for releases created with GITHUB_TOKEN.
  release-bins:
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    needs: release-please
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-bins.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      source_sha: ${{ needs.release-please.outputs.sha }}

  release-images:
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    needs: release-please
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/stage-build.yaml
    secrets: inherit
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      source_sha: ${{ needs.release-please.outputs.sha }}
