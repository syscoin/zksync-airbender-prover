name: Cargo license check
on: pull_request
permissions:
  contents: read
jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Install pinned cargo-deny without Docker Hub
      shell: bash
      run: |
        set -euo pipefail
        tool_dir="$(mktemp -d "${RUNNER_TEMP}/cargo-deny.XXXXXX")"
        archive="${tool_dir}/cargo-deny.tar.gz"
        curl --fail --location --proto '=https' --tlsv1.2 \
          --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
          --output "${archive}" \
          https://github.com/EmbarkStudios/cargo-deny/releases/download/0.18.6/cargo-deny-0.18.6-x86_64-unknown-linux-musl.tar.gz
        printf '%s  %s\n' \
          a9c3db6db22288045ad8407bd0febbb13c6339b3d948d666ae8ef634fb3f3853 \
          "${archive}" | sha256sum --check --strict
        tar -xzf "${archive}" -C "${tool_dir}" --strip-components=1 \
          cargo-deny-0.18.6-x86_64-unknown-linux-musl/cargo-deny
        "${tool_dir}/cargo-deny" --version
        printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"
    - name: Check dependency policy
      shell: bash
      env:
        CARGO_NET_GIT_FETCH_WITH_CLI: "false"
        CARGO_TERM_COLOR: always
      run: |
        set -euo pipefail
        rustup show || rustup toolchain install
        cargo-deny --log-level warn --manifest-path Cargo.toml --all-features \
          check --allow unmaintained --hide-inclusion-graph
