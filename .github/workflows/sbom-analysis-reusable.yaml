# Reusable workflow: generates SBOMs (Software Bill of Materials) for both source
# code and container images. GitHub retains the evidence; Dependency Track upload
# runs when configured.
#
# An SBOM is a machine-readable inventory of every library and component that goes
# into a software artifact.
# It records dependency metadata in CycloneDX format. When configured,
# Dependency Track analyzes these inventories for known vulnerabilities. This
# retained evidence lets us:
#   - detect newly disclosed CVEs in our dependencies without re-scanning manually;
#   - satisfy security audits and compliance frameworks (SOC 2, ISO 27001, etc.)
#     that require evidence of third-party component oversight;
#   - respond quickly to supply-chain incidents (e.g. log4shell-style events) by
#     knowing exactly which builds are affected.
#
# Image identity validation is independent of optional external tracking. Both source
# and image evidence are retained in GitHub even if Dependency Track is absent or
# its configured upload fails.

name: SBOM generation and evidence

on:
  workflow_call:
    inputs:
      version:
        description: Version string to sync (e.g. 1.2.3)
        required: true
        type: string
      source_sha:
        description: Exact source commit represented by the image and code SBOM
        required: true
        type: string
      # SYSCOIN: Preserve the original build's digests and attempt across reusable/job retries.
      image_digests:
        description: JSON object mapping every expected image component to its immutable build digest
        required: true
        type: string
      build_run_attempt:
        description: Original build attempt associated with image_digests, preserved on SBOM-only retries
        required: true
        type: string

jobs:
  create-parent-project:
    name: Validate the image inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_matrix: ${{ steps.images.outputs.image_matrix }}
    steps:
      - name: Checkout hardened SBOM tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Keep the digest validator bound to this workflow's tooling revision.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sbom-tooling
          sparse-checkout: .github/scripts
          fetch-depth: '1'
          persist-credentials: false

      - name: Validate complete immutable image inventory
        # SYSCOIN: Validate the reusable-workflow boundary before contacting Dependency Track
        # or scanning images; never fill a missing build result by resolving a mutable tag.
        id: images
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TOOLING_SHA: ${{ job.workflow_sha }}
          VERSION: ${{ inputs.version }}
          IMAGE_DIGESTS: ${{ inputs.image_digests }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
        run: |
          set -euo pipefail
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C .sbom-tooling rev-parse HEAD)" == "${TOOLING_SHA}" ]]
          [[ -z "$(git -C .sbom-tooling status --porcelain --untracked-files=all)" ]]
          image_matrix="$(python3 .sbom-tooling/.github/scripts/image-sbom-identity.py matrix)"
          echo "image_matrix=${image_matrix}" >> "${GITHUB_OUTPUT}"

  dependency-track-config:
    name: Check Dependency Track configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: Checkout trusted configuration checker
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sbom-config-tooling
          sparse-checkout: .github/scripts
          fetch-depth: '1'
          persist-credentials: false
      - name: Check complete configuration without exposing credentials
        id: config
        shell: bash
        env:
          TOOLING_SHA: ${{ job.workflow_sha }}
          DT_HOSTNAME: ${{ vars.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          DT_PARENT_UUID: ${{ vars.DEPENDENCY_TRACK_PARENT_PROJECT_UUID }}
        run: |
          set -euo pipefail
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C .sbom-config-tooling rev-parse HEAD)" == "${TOOLING_SHA}" ]]
          [[ -z "$(git -C .sbom-config-tooling status --porcelain --untracked-files=all)" ]]
          enabled="$(python3 .sbom-config-tooling/.github/scripts/dependency-track-config.py)"
          echo "enabled=${enabled}" >> "${GITHUB_OUTPUT}"
          if [[ "${enabled}" == false ]]; then
            echo "Dependency Track is not configured. SBOMs are retained as GitHub artifacts; external vulnerability tracking was not run." >> "${GITHUB_STEP_SUMMARY}"
          fi

  dependency-track-project:
    name: Create or verify Dependency Track collection project
    needs: [create-parent-project, dependency-track-config]
    if: ${{ needs.dependency-track-config.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted Dependency Track tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sbom-tooling
          sparse-checkout: .github/scripts
          fetch-depth: '1'
          persist-credentials: false
      - name: Create or verify Dependency Track collection project
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C .sbom-tooling rev-parse HEAD)" == "${TOOLING_SHA}" ]]
          [[ -z "$(git -C .sbom-tooling status --porcelain --untracked-files=all)" ]]
          bash .sbom-tooling/.github/scripts/create-dtrack-collection-project.sh
        env:
          TOOLING_SHA: ${{ job.workflow_sha }}
          DT_BASE_URL: https://${{ vars.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_VERSION: ${{ inputs.version }}
          PARENT_UUID: ${{ vars.DEPENDENCY_TRACK_PARENT_PROJECT_UUID }}

  sbom-code:
    name: Generate and upload SBOM of the source code for analysis
    needs: [create-parent-project, dependency-track-config, dependency-track-project]
    if: ${{ !cancelled() && needs.create-parent-project.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout bound SBOM identity tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sbom-tooling
          sparse-checkout: .github/scripts
          fetch-depth: '1'
          persist-credentials: false
      - name: Checkout exact source to scan
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # SYSCOIN: Scan the exact source material recorded by the image attestation.
          ref: ${{ inputs.source_sha }}
          path: .sbom-source
          fetch-depth: '1'
          persist-credentials: false

      - name: Verify source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C .sbom-source rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          [[ -z "$(git -C .sbom-source status --porcelain --untracked-files=all)" ]]

      - name: Generate CycloneDX file on code analysis
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .sbom-source
          output-file: "bom-code.cdx.json"
          format: 'cyclonedx-json@1.6'
          upload-artifact: 'false'
          upload-release-assets: 'false'

      - name: Bind exact source and build identity to source SBOM
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TOOLING_SHA: ${{ job.workflow_sha }}
          VERSION: ${{ inputs.version }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
        run: |
          set -euo pipefail
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C .sbom-tooling rev-parse HEAD)" == "${TOOLING_SHA}" ]]
          [[ -z "$(git -C .sbom-tooling status --porcelain --untracked-files=all)" ]]
          [[ "$(git -C .sbom-source rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          [[ -z "$(git -C .sbom-source status --porcelain --untracked-files=all)" ]]
          python3 .sbom-tooling/.github/scripts/image-sbom-identity.py bind-source bom-code.cdx.json > bom-code.bound.cdx.json

      - name: Preserve source SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: bom-code.bound.cdx.json
          if-no-files-found: error

      - name: Upload CycloneDX file to Dependency Track
        if: ${{ needs.dependency-track-project.result == 'success' }}
        uses: DependencyTrack/gh-upload-sbom@b717d6595efa77a7ff1b18b57ac28597afc75d77 # v4.0.0
        with:
          serverhostname: ${{ vars.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          projectname: "${{ github.event.repository.name }}-code"
          projectversion: ${{ inputs.version }}
          isLatest: true
          bomfilename: "bom-code.bound.cdx.json"
          autocreate: true
          parentname: ${{ github.event.repository.name }}
          parentversion: ${{ inputs.version }}

  sbom-image:
    name: Generate and upload SBOM of the container images for analysis
    # Scan even if external tracking setup failed; its failed job still fails the workflow.
    needs: [create-parent-project, dependency-track-config, dependency-track-project]
    if: ${{ !cancelled() && needs.create-parent-project.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # needed to pull images from GHCR
    strategy:
      # SYSCOIN: Each matrix row carries the digest from its own completed build.
      matrix: ${{ fromJSON(needs.create-parent-project.outputs.image_matrix) }}
    steps:
      - name: Checkout bound SBOM evidence tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sbom-tooling
          sparse-checkout: |
            .github/scripts
            scripts
            patches
          fetch-depth: '1'
          persist-credentials: false

      - name: Checkout exact source lock for image build evidence
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha }}
          path: .sbom-image-source
          sparse-checkout: Cargo.lock
          sparse-checkout-cone-mode: false
          fetch-depth: '1'
          persist-credentials: false

      - name: Generate CycloneDX file on image analysis
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}
          registry-username: ${{ github.repository_owner }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          output-file: "bom-${{ matrix.app }}-image.cdx.json"
          format: 'cyclonedx-json@1.6'
          upload-artifact: 'false'
          upload-release-assets: 'false'

      - name: Bind image build identity to SBOM evidence
        # SYSCOIN: Keep the scanned image digest and source/tooling identity inside the
        # uploaded CycloneDX document, even when another run reuses the version label.
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TOOLING_SHA: ${{ job.workflow_sha }}
          VERSION: ${{ inputs.version }}
          COMPONENT: ${{ matrix.app }}
          IMAGE_DIGEST: ${{ matrix.digest }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
        run: |
          set -euo pipefail
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C .sbom-tooling rev-parse HEAD)" == "${TOOLING_SHA}" ]]
          [[ -z "$(git -C .sbom-tooling status --porcelain --untracked-files=all)" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C .sbom-image-source rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          [[ -z "$(git -C .sbom-image-source status --porcelain --untracked-files=all)" ]]
          gpu_args=()
          if [[ "${COMPONENT}" != zksync-os-prover-fri ]]; then
            gpu_args=(--gpu-backend-pins .sbom-tooling/patches/gpu32-memory.json)
            python3 .sbom-tooling/.github/scripts/image-sbom-identity.py gpu-backend-pins \
              .sbom-tooling/patches/gpu32-memory.json --source-lock .sbom-image-source/Cargo.lock \
              > gpu-backend-build-pins.json
          fi
          python3 .sbom-tooling/.github/scripts/image-sbom-identity.py bind \
            "${COMPONENT}" "${IMAGE_DIGEST}" "bom-${COMPONENT}-image.cdx.json" \
            --airbender-pins .sbom-tooling/patches/airbender-fork-source.json \
            --source-lock .sbom-image-source/Cargo.lock \
            "${gpu_args[@]}" \
            > "bom-${COMPONENT}-image.bound.cdx.json"
          python3 .sbom-tooling/.github/scripts/image-sbom-identity.py airbender-pins \
            .sbom-tooling/patches/airbender-fork-source.json \
            --source-lock .sbom-image-source/Cargo.lock > airbender-build-pins.json
          python3 .sbom-tooling/.github/scripts/image-sbom-identity.py record \
            "${COMPONENT}" "${IMAGE_DIGEST}" > "image-identity.json"

      - name: Preserve immutable image SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-sbom-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
          path: |
            bom-${{ matrix.app }}-image.bound.cdx.json
            image-identity.json
            airbender-build-pins.json
            gpu-backend-build-pins.json
          if-no-files-found: error

      - name: Upload CycloneDX file to Dependency Track
        if: ${{ needs.dependency-track-project.result == 'success' }}
        uses: DependencyTrack/gh-upload-sbom@b717d6595efa77a7ff1b18b57ac28597afc75d77 # v4.0.0
        with:
          serverhostname: ${{ vars.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          projectname: "${{ github.event.repository.name }}-${{ matrix.app }}-image"
          projectversion: ${{ inputs.version }}
          isLatest: true
          bomfilename: "bom-${{ matrix.app }}-image.bound.cdx.json"
          autocreate: true
          parentname: ${{ github.event.repository.name }}
          parentversion: ${{ inputs.version }}
