[workspace]
members = [
    "crates/sequencer_proof_client",
    "crates/zksync_os_fri_prover",
    "crates/zksync_os_snark_prover",
    "crates/zksync_os_prover_service",
    "crates/protocol_version",
]
resolver = "2"

[workspace.package]
edition = "2021"
#rust-version = "1.88"
version = "0.8.2"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-airbender-prover/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]

[workspace.dependencies]
# internal dependencies
zksync_sequencer_proof_client = { path = "crates/sequencer_proof_client" }
protocol_version = { path = "crates/protocol_version" }
zksync_os_fri_prover = { path = "crates/zksync_os_fri_prover" }

# zksync-airbender dependencies
# SYSCOIN: Pin the reviewed degree-lift fork even for direct Cargo resolution.
# The wrapper's rc.2 source is redirected to this same revision below.
zksync_airbender_execution_utils = { package = "execution_utils", git = "https://github.com/syscoin/zksync-airbender", rev = "553fdd31b9d7a0b354845c7b6b8e7c3d13337c52" }
zksync_airbender_cli = { package = "cli", git = "https://github.com/syscoin/zksync-airbender", rev = "553fdd31b9d7a0b354845c7b6b8e7c3d13337c52" }

# zkos-wrapper dependencies
# v0.6.0-rc.2 = rc.1 plus matter-labs/zkos-wrapper#77 (fold the unified layer into
# `BinaryCommitment::aux_params`). Its Airbender refs are redirected below.
# Level stated explicitly, not inherited from the wrapper's default, so it can't drift out
# of lockstep with `PROVING_SECURITY_LEVEL`.
zkos_wrapper = { package = "zkos-wrapper", git = "https://github.com/syscoin/zkos-wrapper.git", rev = "88aa2e1a5bb3778e1b1e07f64d95ab5ac5332da8", default-features = false, features = ["security_100"] }

# zksync-crypto dependencies
# NOTE: must use the same source spec as zkos-wrapper so cargo unifies the git deps
# (not yet released to crates.io in a version compatible with zkos-wrapper dev).
# TODO: Once zksync-crypto is released to crates.io - switch to using the crates.io version instead of the git version.
crypto_codegen = { package = "zksync_solidity_vk_codegen", git = "https://github.com/matter-labs/zksync-crypto.git", branch = "oh_for_wrapper" }

# external dependencies
anyhow = "1.0.103"
memmap2 = "0.9.11"
async-trait = "0.1"
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
# SYSCOIN: Allow authenticated sequencer URLs to enter via secret-backed environment variables
# instead of shell history and process argv.
clap = { version = "4.5.40", features = ["derive", "env"] }
# SYSCOIN: Probe configured sequencers concurrently with bounded fan-out.
futures-util = "0.3"
# SYSCOIN: Enforce one live Unix prover process per owner-only durable submission spool.
libc = "0.2"
# SYSCOIN: Large prover API responses (witnesses and FRI bundles) are compressed by the
# sequencer. Keep every decoder enabled so reqwest transparently decodes them.
# SYSCOIN: Stream transparently decompressed prover responses under explicit allocation caps.
reqwest = { version = "0.12.19", features = ["json", "stream", "gzip", "brotli", "zstd", "deflate"] }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# SYSCOIN: Used by the locked checked-in guest artifact test.
sha2 = "0.10.9"
# SYSCOIN: Prover polling, bounded retries, and cooperative shutdown require Tokio timers.
tokio = { version = "1.0.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
vise = "0.3.2"
vise-exporter = "0.3.2"
url = "2.5"

# Things below are to guarantee that we can compile in reasonable time.
# Once we do some optimizations to the zkos-wrapper and compression verifier, we'll be able to remove some of them.

# Debug-info generation for the airbender circuit crates is exponential in LLVM and
# overflows rustc's stack (zksync-airbender disables it the same way in its own profiles).
[profile.dev.package."keccak_special5"]
debug = false

[profile.dev.package."setups"]
debug = false

[profile.release.package."blake2_with_compression_verifier"]
opt-level = 1
codegen-units = 256
overflow-checks = true

[profile.release.package."zkos-wrapper"]
opt-level = 2
codegen-units = 256
overflow-checks = true

[profile.release]
lto = false
# This is needed for zksync-airbender crates to compile in a reasonable time for x86-64-unknown-linux-gnu
overflow-checks = true

# zkos-wrapper rc.2 still names the Matter Labs Airbender source. Redirect its
# seven external roots to the same pinned fork so direct resolution stays unified.
[patch."https://github.com/matter-labs/zksync-airbender"]
unified_reduced_machine_verifier = { git = "https://github.com/syscoin/zksync-airbender", rev = "553fdd31b9d7a0b354845c7b6b8e7c3d13337c52" }
blake2_with_compression_verifier = { git = "https://github.com/syscoin/zksync-airbender", rev = "553fdd31b9d7a0b354845c7b6b8e7c3d13337c52" }
execution_utils = { git = "https://github.com/syscoin/zksync-airbender", rev = "553fdd31b9d7a0b354845c7b6b8e7c3d13337c52" }
setups = { git = "https://github.com/syscoin/zksync-airbender", rev = "553fdd31b9d7a0b354845c7b6b8e7c3d13337c52" }
field = { git = "https://github.com/syscoin/zksync-airbender", rev = "553fdd31b9d7a0b354845c7b6b8e7c3d13337c52" }
verifier_generator = { git = "https://github.com/syscoin/zksync-airbender", rev = "553fdd31b9d7a0b354845c7b6b8e7c3d13337c52" }
prover = { git = "https://github.com/syscoin/zksync-airbender", rev = "553fdd31b9d7a0b354845c7b6b8e7c3d13337c52" }
