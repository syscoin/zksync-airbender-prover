[package]
name = "zksync_os_snark_prover"
edition.workspace = true
#rust-version.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# internal dependencies
protocol_version.workspace = true
zksync_sequencer_proof_client.workspace = true

# zksync-airbender dependencies
zksync_airbender_cli.workspace = true
zksync_airbender_execution_utils.workspace = true
riscv_transpiler = { git = "https://github.com/matter-labs/zksync-airbender", tag = "v0.6.0-rc.2" }
verifier_common = { git = "https://github.com/matter-labs/zksync-airbender", tag = "v0.6.0-rc.2" }

# zkos-wrapper dependencies
zkos_wrapper.workspace = true

# external dependencies
anyhow.workspace = true
base64.workspace = true
bincode.workspace = true
clap.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
# SYSCOIN: Materialize the legacy operator artifact in memory before moving the wrapper proof into
# the crash-durable submission boundary, then write it only after a definitive disposition.
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
vise.workspace = true
vise-exporter.workspace = true
url.workspace = true

[features]
# SYSCOIN: The SNARK role builds with the reviewed GPU backend by default.
# CPU-only builds remain explicit via --no-default-features (and cpu-cold when run).
default = ["gpu"]
gpu = ["zkos_wrapper/gpu", "zksync_airbender_cli/gpu"]

[dev-dependencies]
async-trait.workspace = true
crypto_codegen.workspace = true
