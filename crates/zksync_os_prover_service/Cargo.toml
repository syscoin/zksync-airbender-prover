[package]
name = "zksync_os_prover_service"
edition.workspace = true
#rust-version.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "zksync-os-prover-service"
path = "src/main.rs"

[dependencies]
protocol_version.workspace = true
zksync_sequencer_proof_client.workspace = true
# TODO: fix this, should be done together with moving all code base to a single binary
zksync_os_fri_prover = { path = "../zksync_os_fri_prover" }
# SYSCOIN: Combined-role feature selection must remain explicit; otherwise the
# standalone SNARK GPU default silently enables CUDA in CPU-only workspace CI.
zksync_os_snark_prover = { path = "../zksync_os_snark_prover", default-features = false }

tokio = { workspace = true, features = ["signal", "sync", "time"] }
serde_json.workspace = true
reqwest.workspace = true

serde.workspace = true
anyhow.workspace = true
bincode.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
url.workspace = true
vise.workspace = true
vise-exporter.workspace = true

[features]
# SYSCOIN: Normal combined builds use the same GPU wrapping lane. CPU-only
# workspace checks must explicitly pass --no-default-features.
default = ["gpu"]
gpu = ["zksync_os_fri_prover/gpu", "zksync_os_snark_prover/gpu"]
